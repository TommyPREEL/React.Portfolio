server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite output: file names carry a content hash, safe to cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Un-hashed public files (project screenshots, fonts, models, favicon): short cache, revalidate
    location ~* \.(png|jpg|jpeg|webp|avif|gif|ico|svg|woff|woff2|ttf|glb)$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        try_files $uri =404;
    }

    # Redirect /cv to the actual PDF file (browser previews .pdf natively)
    location = /cv {
        return 301 /cv.pdf;
    }

    # SPA fallback: all routes (/express, /projects/<id>...) served by index.html, never cached
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
